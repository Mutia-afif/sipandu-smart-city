{% if is_duplicate %}
<div class="p-4 bg-tertiary-fixed border border-on-tertiary-container/30 rounded-xl mb-4 shadow-sm animate-pulse">
  <div class="flex items-start gap-3">
    <span class="material-symbols-outlined text-on-tertiary-container text-2xl">warning</span>
    <div class="flex-1">
      <h4 class="font-bold text-sm text-on-surface">Terdeteksi Potensi Duplikasi Laporan</h4>
      <p class="text-xs text-on-surface-variant mt-0.5">
        Laporan dengan kategori serupa sudah aktif dalam radius <strong>50 meter</strong>:
        <span class="font-bold text-primary">#{{ duplicate_no }} - {{ duplicate_title }}</span>
      </p>
      <div class="mt-3 flex items-center gap-2">
        <a href="#aduan-{{ duplicate_id }}" class="text-xs font-bold px-3 py-1.5 bg-surface-container-lowest text-primary rounded-lg border border-[#E2E8F0] hover:bg-surface-container shadow-xs">
          Lihat Aduan Tersebut
        </a>
        <button type="button" onclick="this.closest('.animate-pulse').remove()" class="text-xs font-bold px-3 py-1.5 bg-secondary text-white rounded-lg hover:bg-on-secondary-container transition">
          Abaikan & Tetap Kirim Baru
        </button>
      </div>
    </div>
  </div>
</div>
{% endif %}
